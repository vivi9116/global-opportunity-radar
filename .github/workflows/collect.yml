name: Global opportunity collection

on:
  schedule:
    - cron: '11,31,51 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check evidence handling and rendering
        run: |
          python opportunity_monitor_24h.py --self-test
          node tests/test_ui.js
      - name: Collect public sources without a browser
        id: scan
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python opportunity_monitor_24h.py --once
      - name: Record actual result and publish only public files
        if: always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python cloud/finalize_run.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/latest.json data/source_health.json data/source_state.json data/discovery_candidates.json data/cloud_last_run.json data/translation_cache.json data/scan_history.json site/
          if ! git diff --cached --quiet; then
            git commit -m 'Update opportunity data and factual source status [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
      - name: Upload the public dashboard snapshot
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Deploy the cloud dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Preserve failure in the workflow conclusion
        if: steps.scan.outcome != 'success'
        run: exit 1
