name: Global Money Radar Dual-Track (WeChat/Feishu/Bark Push + 20m Full Scan)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounty_sniper_and_radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 4. Run Fast Bounty Sniper & Push to WeChat/Feishu/Bark
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CHATURBATE_WM: ${{ secrets.CHATURBATE_WM }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python opportunity_monitor_24h.py --cloud-once

      - name: 5. Auto Commit & Push Updated Signals
        run: |
          git config --global user.name "Global-Radar-Bot"
          git config --global user.email "radar-bot@users.noreply.github.com"
          git add live_signals.json
          git add -f radar_pain_solver_history.db
          git diff --staged --quiet || (git commit -m "Auto-update signals & push state [skip ci]" && git push)
